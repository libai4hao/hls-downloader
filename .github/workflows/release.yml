name: build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build Windows (cli + gui)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller yt-dlp

      - name: Download ffmpeg (essentials)
        shell: pwsh
        run: |
          # gyan.dev 固定 essentials 地址，解压成 ffmpeg-*/bin/ffmpeg.exe 结构（spec 里 ROOT.glob("ffmpeg*/bin/ffmpeg.exe") 能命中）
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath .
          Remove-Item ffmpeg.zip
          Get-ChildItem -Directory | Where-Object { $_.Name -like "ffmpeg-*" } | ForEach-Object {
            Write-Host "ffmpeg dir: $($_.FullName)"
            Write-Host "ffmpeg.exe: $(Test-Path (Join-Path $_.FullName 'bin\ffmpeg.exe'))"
            Write-Host "ffprobe.exe: $(Test-Path (Join-Path $_.FullName 'bin\ffprobe.exe'))"
          }

      - name: Build CLI
        run: pyinstaller --clean --noconfirm build_cli.spec

      - name: Build GUI
        run: pyinstaller --clean --noconfirm build_gui.spec

      - name: Package zips
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Compress-Archive -Path "dist\hls_download\*" -DestinationPath "hls_download.zip" -CompressionLevel Optimal
          Compress-Archive -Path "dist\hls_download_gui\*" -DestinationPath "hls_download_gui.zip" -CompressionLevel Optimal
          Get-ChildItem *.zip | ForEach-Object { Write-Host "$($_.Name)  $([math]::Round($_.Length/1MB, 1)) MB" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hls-downloader-windows
          path: |
            hls_download.zip
            hls_download_gui.zip
          if-no-files-found: error

      - name: Create release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hls_download.zip
            hls_download_gui.zip
          generate_release_notes: true

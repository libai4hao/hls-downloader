name: build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-full:
    name: Build Windows full (cli + gui, 内置 ffmpeg)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller yt-dlp==2026.11.23 pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Download ffmpeg (essentials, pinned + sha256 verified)
        shell: pwsh
        run: |
          # 固定版本 + 校验和，避免可变 URL 供应链风险；解压成 ffmpeg-*/bin/ffmpeg.exe 结构（spec 里 ROOT.glob("ffmpeg*/bin/ffmpeg.exe") 能命中）
          $ErrorActionPreference = "Stop"
          $url = "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.2-essentials_build.zip"
          $expected = "60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          $actual = (Get-FileHash -Algorithm SHA256 ffmpeg.zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "SHA256 mismatch: expected=$expected actual=$actual" }
          Expand-Archive -Path ffmpeg.zip -DestinationPath .
          Remove-Item ffmpeg.zip
          Get-ChildItem -Directory | Where-Object { $_.Name -like "ffmpeg-*" } | ForEach-Object {
            Write-Host "ffmpeg dir: $($_.FullName)"
            Write-Host "ffmpeg.exe: $(Test-Path (Join-Path $_.FullName 'bin\ffmpeg.exe'))"
            Write-Host "ffprobe.exe: $(Test-Path (Join-Path $_.FullName 'bin\ffprobe.exe'))"
          }

      - name: Build CLI
        run: pyinstaller --clean --noconfirm build_cli.spec

      - name: Build GUI
        run: pyinstaller --clean --noconfirm build_gui.spec

      - name: Package full zips
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Compress-Archive -Path "dist\hls_download\*" -DestinationPath "hls_download.zip" -CompressionLevel Optimal
          Compress-Archive -Path "dist\hls_download_gui\*" -DestinationPath "hls_download_gui.zip" -CompressionLevel Optimal
          Get-ChildItem *.zip | ForEach-Object { Write-Host "$($_.Name)  $([math]::Round($_.Length/1MB, 1)) MB" }

      - name: Upload artifacts (full)
        uses: actions/upload-artifact@v7
        with:
          name: hls-downloader-full
          path: |
            hls_download.zip
            hls_download_gui.zip
          if-no-files-found: error

  build-lite:
    name: Build Windows lite (cli + gui, 使用环境 ffmpeg)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller yt-dlp==2026.11.23 pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Build CLI lite
        run: pyinstaller --clean --noconfirm build_cli_lite.spec

      - name: Build GUI lite
        run: pyinstaller --clean --noconfirm build_gui_lite.spec

      - name: Package lite zips
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Compress-Archive -Path "dist\hls_download_lite\*" -DestinationPath "hls_download_lite.zip" -CompressionLevel Optimal
          Compress-Archive -Path "dist\hls_download_gui_lite\*" -DestinationPath "hls_download_gui_lite.zip" -CompressionLevel Optimal
          Get-ChildItem *.zip | ForEach-Object { Write-Host "$($_.Name)  $([math]::Round($_.Length/1MB, 1)) MB" }

      - name: Upload artifacts (lite)
        uses: actions/upload-artifact@v7
        with:
          name: hls-downloader-lite
          path: |
            hls_download_lite.zip
            hls_download_gui_lite.zip
          if-no-files-found: error

  release:
    name: Release (tag only)
    runs-on: windows-latest
    needs: [build-full, build-lite]
    permissions:
      contents: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download full artifacts
        uses: actions/download-artifact@v7
        with:
          name: hls-downloader-full
          path: zips

      - name: Download lite artifacts (merge into same dir)
        uses: actions/download-artifact@v7
        with:
          name: hls-downloader-lite
          path: zips
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            zips/hls_download.zip
            zips/hls_download_gui.zip
            zips/hls_download_lite.zip
            zips/hls_download_gui_lite.zip
          generate_release_notes: true

name: Windows release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: Test (pytest)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install locked build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run tests
        run: python -m pytest -q

  prepare-ffmpeg:
    name: Prepare verified FFmpeg
    # 与 test 并行：FFmpeg 准备不依赖测试结果，串在 test 之后会白白多等一整个测试时长
    runs-on: windows-latest
    steps:
      - name: Download and verify FFmpeg
        shell: pwsh
        run: |
          # 固定版本 + SHA256 校验，避免可变 URL 供应链风险；解压成 ffmpeg-*/bin/ 结构供各 spec 的 ROOT.glob 命中
          $ErrorActionPreference = "Stop"
          $url = "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.2-essentials_build.zip"
          $expected = "60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          $actual = (Get-FileHash -Algorithm SHA256 ffmpeg.zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "FFmpeg SHA256 mismatch: $actual" }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-unpack
          $root = Get-ChildItem ffmpeg-unpack -Directory | Select-Object -First 1
          if (!(Test-Path (Join-Path $root.FullName 'bin\ffmpeg.exe')) -or !(Test-Path (Join-Path $root.FullName 'bin\ffprobe.exe'))) { throw "FFmpeg binaries missing" }
          New-Item -ItemType Directory -Force -Path ffmpeg-package | Out-Null
          Copy-Item $root.FullName ffmpeg-package -Recurse
      - uses: actions/upload-artifact@v7
        with:
          name: verified-ffmpeg
          path: ffmpeg-package/ffmpeg-*
          if-no-files-found: error
          retention-days: 1

  build-cli:
    name: Build CLI (内置 ffmpeg)
    needs: [test, prepare-ffmpeg]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install locked build dependencies
        run: python -m pip install -r requirements-build.txt
      - uses: actions/download-artifact@v7
        with:
          name: verified-ffmpeg
          path: .
      - name: Build CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:HLS_BUNDLE_FFMPEG = "1"
          pyinstaller --noconfirm --workpath build/pyi-cli --distpath dist build_cli.spec
          dist/hls_download/hls_download.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "CLI smoke test failed" }
          Copy-Item README.md, config.example.json dist/hls_download/
          Compress-Archive -Path dist/hls_download -DestinationPath hls-downloader-cli.zip -CompressionLevel Optimal
      - uses: actions/upload-artifact@v7
        with:
          name: release-cli
          path: hls-downloader-cli.zip
          if-no-files-found: error

  build-portable-full:
    name: Build Portable (内置 ffmpeg)
    needs: [test, prepare-ffmpeg]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install locked build dependencies
        run: python -m pip install -r requirements-build.txt
      - uses: actions/download-artifact@v7
        with:
          name: verified-ffmpeg
          path: .
      - name: Build shared full portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:HLS_BUNDLE_FFMPEG = "1"
          pyinstaller --noconfirm --workpath build/pyi-portable-full --distpath dist/full build_portable.spec
          $full = 'dist/full/hls_downloader_portable'
          & (Join-Path $full 'hls_download.exe') --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Portable CLI smoke test failed" }
          Copy-Item README.md, config.example.json $full/
          $gui = Start-Process -FilePath (Resolve-Path (Join-Path $full 'hls_download_gui.exe')) -PassThru
          Start-Sleep -Seconds 5
          if ($gui.HasExited -and $gui.ExitCode -ne 0) { throw "Portable GUI startup smoke test failed: $($gui.ExitCode)" }
          if (!$gui.HasExited) { Stop-Process -Id $gui.Id -Force }
          Compress-Archive -Path $full -DestinationPath hls-downloader-portable.zip -CompressionLevel Optimal
      - uses: actions/upload-artifact@v7
        with:
          name: release-portable-full
          path: hls-downloader-portable.zip
          if-no-files-found: error

  build-portable-slim:
    name: Build Portable Slim (外置 ffmpeg)
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install locked build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build shared slim portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:HLS_BUNDLE_FFMPEG = "0"
          pyinstaller --noconfirm --workpath build/pyi-portable-slim --distpath dist/slim build_portable.spec
          $slim = 'dist/slim/hls_downloader_portable'
          if (Test-Path (Join-Path $slim '_internal/ffmpeg')) { throw "Slim build unexpectedly contains bundled FFmpeg" }
          & (Join-Path $slim 'hls_download.exe') --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Slim CLI smoke test failed" }
          Copy-Item README.md, config.example.json $slim/
          Compress-Archive -Path $slim -DestinationPath hls-downloader-portable-slim.zip -CompressionLevel Optimal
      - uses: actions/upload-artifact@v7
        with:
          name: release-portable-slim
          path: hls-downloader-portable-slim.zip
          if-no-files-found: error

  release:
    name: Release (tag only)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build-cli, build-portable-full, build-portable-slim]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Verify archives and generate checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = Get-ChildItem release-assets -File -Filter '*.zip' | Sort-Object Name
          if ($files.Count -ne 3) { throw "Expected 3 release ZIP files, found $($files.Count)" }
          $verifyRoot = Join-Path $env:RUNNER_TEMP 'release-verify'
          New-Item -ItemType Directory -Force -Path $verifyRoot | Out-Null
          foreach ($file in $files) {
            $dest = Join-Path $verifyRoot ([IO.Path]::GetFileNameWithoutExtension($file.Name))
            Expand-Archive -Path $file.FullName -DestinationPath $dest -Force
            if (!(Get-ChildItem $dest -Recurse -File | Select-Object -First 1)) { throw "Archive is empty: $($file.Name)" }
          }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Encoding ascii release-assets/SHA256SUMS.txt
          Get-Content release-assets/SHA256SUMS.txt
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          generate_release_notes: true
